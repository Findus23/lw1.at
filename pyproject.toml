[project]
name = "lw1"
version = "0.1.0"
description = ""
authors = [{ name = "Lukas Winkler", email = "git@lw1.at" }]
requires-python = ">=3.13,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "Jinja2>=3.1.1,<4",
    "toml>=0.10.2,<0.11",
    "watchfiles>=1.0.0,<2",
    "python-slugify>=8.0.0,<9",
    "PyYAML>=6.0,<7",
    "Markdown>=3.3.6,<4",
    "Pygments>=2.11.2,<3",
    "markdown-katex>=202406.1035,<202407",
    "Babel>=2.10.1,<3",
    "redis>=7.0.0",
    "hiredis>=3.1.0,<4",
    "lxml-stubs>=0.5.1,<0.6",
    "thumbhash-python",
    "pillow>=12.0.0",
]

[project.scripts]
lw1 = "lw1.main:main"

[dependency-groups]
dev = ["ruff>=0.15.0"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
thumbhash-python = { git = "https://github.com/Findus23/thumbhash-python.git" }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["E711"]
select = [
    "E101", # checks about indentation and whitespace about operators
    "E112",
    "E113",
    "E115",
    "E117",
    "E225",
    "E227",
    "E228",
    "YTT", # old python-like code
    "W", # trailing whitespace and whitespace in empty lines
    "UP"
]